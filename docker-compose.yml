services:
  broadcast-box:
    build: .
    image: broadcast-box-ssn
    hostname: broadcast-box
    container_name: broadcast-box
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UDP_MUX_PORT: 8181
      INCLUDE_PUBLIC_IP_IN_NAT_1_TO_1_IP: "yes"
      NAT_1_TO_1_IP: ${IP_ADDRESS}
      NETWORK_TEST_ON_START: "false"
      FRONTEND_ADMIN_TOKEN: ${FRONTEND_ADMIN_TOKEN}
      STREAM_PROFILE_PATH: /app/profiles
      STREAM_PROFILE_POLICY: ${STREAM_PROFILE_POLICY:-ANYONE_WITH_RESERVED}

      # Discord "stream is live" / "stream ended" notifications
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      NOTIFY_OFFLINE_GRACE_PERIOD: ${NOTIFY_OFFLINE_GRACE_PERIOD:-60s}
      NOTIFY_STREAM_KEYS: ${NOTIFY_STREAM_KEYS:-}

      # Social Stream Ninja chat forwarding
      SSN_SESSION_ID: ${SSN_SESSION_ID}
      SSN_VERBOSE: ${SSN_VERBOSE:-false}
    volumes:
      # Stream profiles (stream key + bearer token) survive container rebuilds
      - ./profiles:/app/profiles
    ports:
      - "8181:8181/udp"
    networks:
      - outside

networks:
  outside:
    external: true
    name: nginx-reverse-proxy_default
